<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Agendamento</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #333; }
        select, input, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; }
        button:hover { background: #0056b3; }
        h2 { margin: 0 0 10px 0; color: #222; text-align: center; }
        p { color: #666; text-align: center; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Agende seu Horário</h2>
        <p>Escolha o serviço desejado e preencha seus dados para reservar.</p>
        
        <form id="form-agendamento" onsubmit="salvarAgendamento(event)">
            <label for="nome">Seu Nome:</label>
            <input type="text" id="nome" required placeholder="Ex: João Silva">

            <label for="telefone">Seu Telefone:</label>
            <input type="tel" id="telefone" required placeholder="Ex: (86) 99999-9999">

            <label for="select-servico">Selecione o Serviço:</label>
            <select id="select-servico" required>
                <!-- Preenchido dinamicamente pelo JavaScript -->
            </select>

            <label for="data">Escolha o Dia:</label>
            <input type="date" id="data" required>

            <label for="horario">Escolha o Horário:</label>
            <select id="horario" required>
                <option value="">Selecione...</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
            </select>

            <button type="submit">Confirmar Agendamento</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
